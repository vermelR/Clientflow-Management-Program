name: Test rules and deploy to Firebase

# Every push runs the security-rules tests. When they pass, and the
# FIREBASE_SERVICE_ACCOUNT secret is set (see README → "Hosting on
# Firebase"), the site and the Firestore rules are deployed together,
# so the live rules always match the code.

on:
  push:
    branches:
      - claude/beautiful-albattani-2pb1q7
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Rules tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            # Surface failures as annotations so they show on the PR.
            grep -E "not ok|Error|error:|expected|✖" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip until the deploy secret is set
        if: env.SERVICE_ACCOUNT == ''
        run: echo "FIREBASE_SERVICE_ACCOUNT is not set, so nothing was deployed. See README → Hosting on Firebase."
      - uses: actions/setup-node@v5
        if: env.SERVICE_ACCOUNT != ''
        with:
          node-version: 22
          cache: npm
      - if: env.SERVICE_ACCOUNT != ''
        run: npm ci
      - name: Deploy site and rules
        if: env.SERVICE_ACCOUNT != ''
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only hosting,firestore:rules --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
