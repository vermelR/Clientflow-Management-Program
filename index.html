<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ ClientFlow — Client & Invoice Manager</title>
  <meta name="description" content="Manage DJ clients, gigs and invoices in one place.">
  <meta name="theme-color" content="#16122b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DJ ClientFlow">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login / sign-up screen (shown until someone signs in) -->
  <div class="auth-screen hidden" id="authScreen"></div>

  <div class="app hidden" id="appShell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">🎧</div>
        <div class="brand-text">
          <div class="brand-name" id="sidebarBizName">DJ ClientFlow</div>
          <div class="brand-sub">Client &amp; Invoice Manager</div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">📊</span> Dashboard</button>
        <button class="nav-item" data-view="clients"><span class="nav-icon">👥</span> Clients</button>
        <button class="nav-item" data-view="events"><span class="nav-icon">🎶</span> Gigs &amp; Events</button>
        <button class="nav-item" data-view="invoices"><span class="nav-icon">📄</span> Invoices</button>
        <button class="nav-item" data-view="calendar"><span class="nav-icon">📅</span> Calendar</button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙️</span> Settings<span class="nav-dot hidden" id="updatesDot" title="New updates"></span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="account-box hidden" id="accountBox"></div>
        <div class="cloud-status status-off" id="cloudStatus">💾 This device only</div>
        <div class="hint" id="sidebarHint">Turn on cloud sync in Settings to reach your data from any device.</div>
      </div>
    </aside>

    <main class="main" id="main">
      <!-- Views are rendered here by app.js -->
    </main>
  </div>

    <!-- Reminders: upcoming gigs and what's still owed -->
    <button class="reminders-fab" id="remindersBtn" title="Upcoming gigs and payments" aria-expanded="false">
      <span class="fab-icon">🔔</span>
      <span class="fab-label">Reminders</span>
      <span class="fab-count hidden" id="remindersCount"></span>
    </button>
    <div class="reminders-backdrop hidden" id="remindersBackdrop"></div>
    <aside class="reminders-panel hidden" id="remindersPanel" aria-label="Reminders"></aside>

  <!-- Modal -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Toast -->
  <div class="toast hidden" id="toast"></div>

  <!-- Printable invoice (only visible when printing) -->
  <div id="printArea" class="print-area"></div>

  <!-- Fill this in once to run the app for multiple users (see README) -->
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    // Installable app + offline launch. Registration is relative so it
    // works from a project sub-path like /Clientflow-Management-Program/.
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW registration failed", err));
      });
    }
  </script>
</body>
</html>
